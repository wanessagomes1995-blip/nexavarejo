<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexaVarejo | Gestão de Produtos</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>NexaVarejo</h1>
    <p>Organização simples para pequenos comércios</p>
  </header>

  <main>
    <section class="painel">
      <h2>Cadastrar produto</h2>

      <form id="form-produto">
        <label for="nome">Nome do produto</label>
        <input id="nome" name="nome" required maxlength="100">

        <label for="categoria">Categoria</label>
        <input id="categoria" name="categoria" required maxlength="60">

        <label for="preco">Preço (R$)</label>
        <input id="preco" name="preco" type="number" min="0.01" step="0.01" required>

        <label for="descricao">Descrição</label>
        <textarea id="descricao" name="descricao" maxlength="300"></textarea>

        <button type="submit">Cadastrar produto</button>
      </form>

      <p id="mensagem" role="status"></p>
    </section>

    <section class="painel">
      <h2>Produtos cadastrados</h2>

      <label for="pesquisa">Pesquisar produto</label>
      <input id="pesquisa" placeholder="Digite o nome do produto">

      <ul id="lista-produtos"></ul>
      <p id="vazio">Nenhum produto cadastrado.</p>
    </section>
  </main>

  <footer>
    <p>NexaVarejo — MVP em desenvolvimento</p>
  </footer>

  <script src="script.js"></script>
</body>

</html>
